appId: com.dupip.invest.connector
productName: Dupip.Invest.Connector
copyright: Copyright © 2026 Dupip

# Where the desktop app checks for and downloads updates from.
publish:
  provider: github
  owner: dupipcom
  repo: iris

directories:
  output: release

# Override the entry point ONLY for the packaged app. The SDK's package.json
# main stays as dist/index.js for npm consumers.
extraMetadata:
  main: dist-desktop/main.js

files:
  - dist/**/*
  - dist-desktop/**/*
  - desktop/renderer/**/*
  - node_modules/**/*
  - package.json

mac:
  category: public.app-category.finance
  target:
    - dmg
    - zip
  icon: desktop/renderer/icon.png
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

win:
  target:
    - nsis
    - portable
  icon: desktop/renderer/icon.png
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  defaultArch: x64

linux:
  target:
    - AppImage
    - deb
  category: Finance
  icon: desktop/renderer/icon.png
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
