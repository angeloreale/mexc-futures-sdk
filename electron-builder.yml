appId: com.dupip.invest.connector
productName: Dupip Invest Connector
copyright: Copyright © 2026 Dupip

directories:
  output: release

# Override the entry point ONLY for the packaged app. The SDK's package.json
# main stays as dist/index.js for npm consumers.
extraMetadata:
  main: dist-desktop/main.js

files:
  - dist/**/*
  - dist-desktop/**/*
  - desktop/renderer/**/*
  - node_modules/**/*
  - package.json

mac:
  category: public.app-category.finance
  target:
    - dmg
    - zip
  icon: desktop/renderer/icon.png
  artifactName: ${productName}-${version}-mac.${ext}

win:
  target:
    - nsis
    - portable
  icon: desktop/renderer/icon.png
  artifactName: ${productName}-${version}-win.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Finance
  icon: desktop/renderer/icon.png
  artifactName: ${productName}-${version}-linux.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
